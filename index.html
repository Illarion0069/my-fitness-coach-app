    <script>
      (function () {
        var splash = document.getElementById('splash');
        var textEl = document.getElementById('splash-text');
        if (!splash || !textEl) return;

        var lang = 'en';
        try {
          var stored = localStorage.getItem('app_lang');
          if (stored === 'ru' || stored === 'en') lang = stored;
          else if (navigator.language && navigator.language.indexOf('ru') === 0) lang = 'ru';
        } catch (e) {}

        var i18n = {
          en: { loading: 'Loading…', bad: 'Bad connection. Trying to connect…', slow: 'Loading is taking longer than usual.' },
          ru: { loading: 'Загрузка…', bad: 'Плохое соединение. Пытаемся подключиться…', slow: 'Загрузка занимает больше времени, чем обычно.' }
        };
        var t = i18n[lang];
        textEl.textContent = t.loading;

        function show(key) {
          splash.classList.add('show');
          textEl.textContent = t[key] || t.loading;
        }
        function hide() {
          splash.classList.remove('show');
        }

        window.__showSplash = show;
        window.__hideSplash = hide;
        window.__appReady = false;

        var showTimer = setTimeout(function () {
          if (!window.__appReady) show('loading');
        }, 1000);

        var slowTimer = setTimeout(function () {
          if (!window.__appReady) show('slow');
        }, 5000);

        function onOffline() { show('bad'); }
        function onOnline() {
          if (window.__appReady) hide();
          else textEl.textContent = t.loading;
        }

        window.addEventListener('offline', onOffline);
        window.addEventListener('online', onOnline);
        if (!navigator.onLine) onOffline();
      })();
    </script>
